<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CranCapital</title>
    <meta name="description" content="Start with a food cart on a real street and grow a business empire in a world every player shares." />
    <meta name="theme-color" content="#14463a" />
    <!-- iPad and iPhone: "Add to Home Screen" opens the game full screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CranCapital" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root">
      <!-- Shown until the game starts (React replaces it). If the game's files
           can't load, this says so instead of leaving a blank page. -->
      <div id="boot" style="font: 16px/1.5 -apple-system, system-ui, sans-serif; color: #15241f; background: #f6f2ea; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box">
        <div>
          <p id="boot-msg" style="margin: 0 0 16px">Loading CranCapital…</p>
          <button id="boot-reload" onclick="location.reload()" style="display: none; font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 999px; border: 0; background: #14463a; color: #fff">Reload</button>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        if (!document.getElementById('boot')) return;
        document.getElementById('boot-msg').textContent = 'The game didn’t load. Check your connection and reload. If it keeps happening, the site may be updating: try again in a few minutes.';
        document.getElementById('boot-reload').style.display = 'inline-block';
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
